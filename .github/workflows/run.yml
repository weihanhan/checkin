name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: 11 0,12 * * * # UTC 时间 00:11、12:11 执行

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
